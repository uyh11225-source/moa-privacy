<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PICKAI 네이버 로그인</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050510;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      line-height: 1.6;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0; color: #a1a1aa; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>로그인 처리 중</h1>
    <p>잠시만 기다려 주세요.<br />앱으로 자동 이동됩니다.</p>
  </div>
</body>
</html>
