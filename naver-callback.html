<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PICKAI 네이버 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050510;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 380px;
      line-height: 1.6;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      margin: 0 0 16px;
      color: #a1a1aa;
      font-size: 15px;
    }
    .err {
      color: #f87171;
      font-size: 14px;
      margin-bottom: 16px;
      word-break: break-word;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      background: #03c75a;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(3, 199, 90, 0.35);
    }
    button.prominent {
      padding: 20px 24px;
      font-size: 18px;
      margin-top: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">로그인 처리 중</h1>
    <p id="message">잠시만 기다려 주세요.<br />앱으로 자동 이동됩니다.</p>
    <p id="error" class="err" hidden></p>
    <button id="openApp" type="button">PICKAI 앱으로 돌아가기</button>
  </div>
  <script>
    (function () {
      var APP_SCHEME = 'marketlens';
      var APP_PATH = 'naver-auth';
      var APP_PACKAGE = 'com.marketlens.app';
      var FALLBACK_URL =
        'https://uyh11225-source.github.io/moa-privacy/naver-callback.html';

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDescription = params.get('error_description');

      var deepLink = '';
      var intentUrl = '';
      var autoDone = false;

      function buildQueryString() {
        var parts = [];
        if (error) {
          parts.push('error=' + encodeURIComponent(error));
          if (errorDescription) {
            parts.push('error_description=' + encodeURIComponent(errorDescription));
          }
        } else {
          if (code) parts.push('code=' + encodeURIComponent(code));
          if (state) parts.push('state=' + encodeURIComponent(state));
        }
        return parts.length ? '?' + parts.join('&') : '';
      }

      function buildDeepLink() {
        return APP_SCHEME + '://' + APP_PATH + buildQueryString();
      }

      function buildIntentUrl() {
        var query = buildQueryString();
        var path = APP_PATH + query;
        var encodedFallback = encodeURIComponent(FALLBACK_URL);
        return (
          'intent://' +
          path +
          '#Intent;scheme=' +
          APP_SCHEME +
          ';package=' +
          APP_PACKAGE +
          ';S.browser_fallback_url=' +
          encodedFallback +
          ';end'
        );
      }

      function openDeepLink() {
        if (!deepLink) return;
        window.location.href = deepLink;
      }

      function openIntent() {
        if (!intentUrl) return;
        window.location.href = intentUrl;
      }

      function openWithUserGesture() {
        openIntent();
        setTimeout(function () {
          openDeepLink();
        }, 400);
      }

      function emphasizeButton() {
        var btn = document.getElementById('openApp');
        btn.classList.add('prominent');
        document.getElementById('message').textContent =
          '자동 이동이 되지 않으면 아래 버튼을 눌러 주세요.';
      }

      function runAutoRedirect() {
        if (autoDone) return;
        autoDone = true;

        openDeepLink();

        setTimeout(function () {
          openIntent();
          setTimeout(emphasizeButton, 600);
        }, 1500);
      }

      var btn = document.getElementById('openApp');
      btn.onclick = function () {
        openWithUserGesture();
      };

      if (!error && (!code || !state)) {
        document.getElementById('title').textContent = '로그인 정보 없음';
        document.getElementById('message').textContent =
          '로그인 정보가 없습니다. 다시 로그인해주세요.';
        btn.classList.add('prominent');
        return;
      }

      deepLink = buildDeepLink();
      intentUrl = buildIntentUrl();

      if (error) {
        document.getElementById('title').textContent = '로그인 실패';
        document.getElementById('message').textContent =
          '앱으로 돌아가 결과를 확인해 주세요.';
        var errEl = document.getElementById('error');
        errEl.hidden = false;
        errEl.textContent = errorDescription || error;
      }

      runAutoRedirect();
    })();
  </script>
</body>
</html>
